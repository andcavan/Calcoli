<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivio Materiali Metallici &amp; Polimerici</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
:root{
  --ink:#e8e9ec;
  --steel:#7a7d8a;
  --steel-light:#9a9ea8;
  --blueprint:#0e0f11;
  --panel:#1c1d23;
  --panel-2:#23252d;
  --line:rgba(255,255,255,.13);
  --patina:#4fc3f7;
  --patina-dark:#0288d1;
  --brass:#ffa726;
  --rust:#ef5350;

  --c-acciai:#9AA5AD;
  --c-inox:#5D7F93;
  --c-alluminio:#8FB3CC;
  --c-ghise:#b0b4bd;
  --c-rame:#e0894a;
  --c-titanio:#b39ddb;
  --c-plastiche:#66bb6a;

  --f-display:'Barlow Condensed',sans-serif;
  --f-body:'DM Mono',monospace;
  --f-mono:'DM Mono',monospace;

  --radius:5px;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.2);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--blueprint);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(79,195,247,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,195,247,.035) 1px, transparent 1px);
  background-size:28px 28px;
}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--patina);color:#0e0f11;}

/* focus visibility */
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--patina); outline-offset:2px;
}

/* ---------- App shell ---------- */
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:#141519; color:var(--ink);
  padding:10px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  position:sticky; top:0; z-index:40;
  border-bottom:1px solid var(--line);
}
.top-back-btn{
  font-family:var(--f-display);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--steel);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:5px 10px;
  transition:all .15s;white-space:nowrap;
}
.top-back-btn:hover{color:var(--patina);border-color:var(--patina);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--patina);display:inline-block;margin-right:6px;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto;}
.brand-mark{
  font-family:var(--f-mono); font-weight:600; font-size:11px; letter-spacing:.12em;
  background:rgba(79,195,247,.12); color:var(--patina); border:1px solid rgba(79,195,247,.3); padding:3px 6px; border-radius:4px;
}
.brand h1{font-family:var(--f-display); font-weight:700; font-size:19px; margin:0; letter-spacing:.04em; text-transform:uppercase; display:flex; align-items:center;}
.brand span.sub{font-size:11.5px; color:var(--steel-light); font-family:var(--f-mono);}

.search-wrap{position:relative; flex:1 1 280px; max-width:420px;}
.search-wrap input{
  width:100%; padding:8px 12px 8px 32px; border-radius:5px; border:1px solid var(--line);
  background:var(--panel-2); color:var(--ink); font-size:13px; font-family:var(--f-mono);
}
.search-wrap input:focus{outline:none;border-color:var(--patina);}
.search-wrap input::placeholder{color:var(--steel);}
.search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); width:15px; height:15px; opacity:.6;}

.topbar nav{display:flex; gap:6px; flex-wrap:wrap;}
.topbar nav button{
  background:transparent; border:1px solid var(--line); color:var(--ink);
  padding:7px 11px; border-radius:5px; font-size:12.5px; cursor:pointer;
  display:flex; align-items:center; gap:6px; font-family:var(--f-display); font-weight:600; letter-spacing:.02em;
  transition:background .15s, border-color .15s;
}
.topbar nav button:hover{background:var(--panel-2); border-color:var(--patina);}
.topbar nav button.active{background:rgba(79,195,247,.14); border-color:var(--patina); color:var(--patina);}
.topbar nav button .count{
  background:rgba(255,255,255,.1); border-radius:8px; padding:0 6px; font-family:var(--f-mono); font-size:10.5px;
}

.layout{display:flex; flex:1; align-items:flex-start;}

.sidebar{
  width:230px; flex:0 0 230px; padding:16px 12px 40px;
  border-right:1px solid var(--line);
  position:sticky; top:53px; align-self:flex-start;
  max-height:calc(100vh - 53px); overflow-y:auto;
}
.sidebar h2{
  font-family:var(--f-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.12em;
  color:var(--steel); margin:18px 6px 8px; font-weight:600;
}
.sidebar h2:first-child{margin-top:2px;}
.cat-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:transparent; border:none; padding:7px 8px; border-radius:4px; cursor:pointer;
  font-size:13px; color:var(--ink); font-family:var(--f-body);
}
.cat-item:hover{background:var(--panel-2);}
.cat-item.active{background:var(--panel); box-shadow:var(--shadow); font-weight:600;}
.cat-swatch{width:11px; height:11px; border-radius:4px; flex:0 0 auto; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
.cat-item .n{margin-left:auto; font-family:var(--f-mono); font-size:11px; color:var(--steel);}

.sidebar .filter-block{margin-top:6px;}
.sidebar select, .sidebar .range-row input{
  width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:5px; font-size:12.5px; background:var(--panel-2); color:var(--ink); font-family:var(--f-mono);
}
.sidebar label.small{font-size:11.5px; color:var(--steel); display:block; margin:10px 6px 4px;}

main{flex:1; min-width:0; padding:20px 24px 60px;}
.results-bar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
.results-bar .count{font-family:var(--f-mono); font-size:12.5px; color:var(--steel);}
.results-bar .active-filters{display:flex; gap:6px; flex-wrap:wrap;}
.chip{
  display:inline-flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line);
  padding:4px 8px; border-radius:12px; font-size:11.5px; font-family:var(--f-mono);
}
.chip button{background:none; border:none; cursor:pointer; color:var(--rust); font-weight:700; padding:0 2px;}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:12px;}

.mat-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px 12px 16px; cursor:pointer; position:relative; box-shadow:var(--shadow);
  transition:transform .12s, box-shadow .12s; text-align:left;
}
.mat-card:hover{transform:translateY(-2px); box-shadow:0 4px 14px rgba(28,33,38,.12);}
.mat-card::before{
  content:""; position:absolute; left:0; top:8px; bottom:8px; width:4px; border-radius:4px; background:var(--cat-color,#999);
}
.mat-card .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
.mat-card h3{font-family:var(--f-mono); font-size:14.5px; margin:0 0 2px; font-weight:600; letter-spacing:.01em;}
.mat-card .sub{font-size:11.5px; color:var(--steel); margin-bottom:8px;}
.mat-card .stats{display:flex; gap:12px; font-family:var(--f-mono); font-size:11px; color:var(--ink); flex-wrap:wrap;}
.mat-card .stats div b{display:block; font-size:12.5px;}
.mat-card .stats div span{color:var(--steel); font-size:9.5px; text-transform:uppercase; letter-spacing:.06em;}
.star-btn{background:none;border:none;cursor:pointer;font-size:16px;color:var(--steel);line-height:1;padding:2px;}
.star-btn.active{color:var(--brass);}
.custom-badge{
  font-family:var(--f-mono); font-size:9px; text-transform:uppercase; background:rgba(79,195,247,.14); color:var(--patina);
  border:1px solid rgba(79,195,247,.3); padding:1px 5px; border-radius:3px; letter-spacing:.05em; margin-left:6px;
}
.compare-check{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--steel); margin-top:8px; font-family:var(--f-mono);}

.weld-row{display:flex; align-items:center; gap:7px; margin-top:9px;}
.weld-row-lbl{font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--steel);}
.weld-badge{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--f-mono); font-size:10px; font-weight:600;
  letter-spacing:.03em; text-transform:uppercase; padding:2px 8px 2px 6px; border-radius:3px; white-space:nowrap;
}
.weld-badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; display:inline-block; flex:none;}
.weld-good{color:var(--patina-dark); background:rgba(79,195,247,.12);}
.weld-mid{color:var(--brass); background:rgba(255,167,38,.16);}
.weld-poor{color:var(--rust); background:rgba(239,83,80,.12);}

.empty-state{padding:60px 20px; text-align:center; color:var(--steel);}
.empty-state h3{font-family:var(--f-display); color:var(--ink); font-size:18px;}

/* ---------- Treatment cards & sheets ---------- */
.treat-card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; cursor:pointer; box-shadow:var(--shadow); transition:transform .12s, box-shadow .12s; text-align:left;
}
.treat-card:hover{transform:translateY(-2px); box-shadow:0 4px 14px rgba(28,33,38,.12);}
.treat-card-top{display:flex; justify-content:flex-end;}
.treat-card h3{font-family:var(--f-display); font-size:15.5px; margin:6px 0 6px; font-weight:700;}
.treat-excerpt{font-size:12.5px; color:var(--steel); line-height:1.4; margin:0 0 10px;}
.tipo-badge{
  font-family:var(--f-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
  padding:2px 8px; border-radius:10px;
}
.tipo-termico{background:rgba(79,195,247,.14); color:var(--patina-dark);}
.tipo-superficiale{background:rgba(255,167,38,.16); color:var(--brass);}
.fam-chips{display:flex; flex-wrap:wrap; gap:6px;}
.fam-chip{
  font-size:10px; font-family:var(--f-mono); padding:2px 7px; border-radius:9px; background:var(--panel-2);
  border:1px solid var(--fc,var(--line)); color:var(--ink);
}
.benefit-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.benefit-list li{padding-left:20px; position:relative; font-size:13px; line-height:1.4;}
.benefit-list li::before{content:"✓"; position:absolute; left:0; color:var(--patina); font-weight:700;}
.norm-block{display:flex; flex-wrap:wrap; gap:8px;}
.norm-block .norm-tag{margin-left:0; font-size:11.5px; padding:3px 9px;}
.treat-link{
  background:none; border:none; padding:0; margin:0; cursor:pointer; font:inherit; color:var(--patina-dark);
  text-decoration:underline dotted; text-underline-offset:2px;
}
.treat-link:hover{color:var(--patina);}
.treat-link-ico{font-size:10px; opacity:.7;}
.mat-link{
  background:var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--cat-color,var(--patina));
  padding:5px 10px; border-radius:12px; font-size:12px; cursor:pointer;
}
.mat-link:hover{background:var(--panel);}
.related-treatments{display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:10px 0 4px;}
.related-lbl{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); font-weight:600;}
.related-chip{
  display:inline-flex; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:4px 10px 4px 4px; font-size:12.5px; cursor:pointer; font-family:var(--f-body); color:var(--ink);
}
.related-chip:hover{background:var(--panel-2);}
.calc-section .calc-row, .calc-section .calc-dims{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:10px;}
.calc-section label{display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--steel); font-family:var(--f-mono);}
.calc-section select, .calc-section input[type="number"]{
  font-family:var(--f-mono); font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--ink); width:120px;
}
.calc-section select{width:auto;}
.calc-result{margin-top:6px; padding:10px 12px; background:var(--panel-2); border-left:3px solid var(--patina); border-radius:4px; font-size:14px;}
.calc-result b{font-family:var(--f-mono); font-size:17px; color:var(--patina-dark);}
.calc-note{font-size:11px; color:var(--steel); margin-top:4px;}
[data-tip]{position:relative;cursor:default}
@keyframes tipIn{from{opacity:0}to{opacity:1}}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:0;background:#1a1e28;border:1px solid rgba(79,195,247,.25);color:#e2e8f4;font-size:10px;padding:7px 11px;border-radius:6px;white-space:pre-wrap;max-width:280px;min-width:180px;z-index:999;line-height:1.6;pointer-events:none;font-family:var(--f-mono);text-align:left;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:tipIn .12s ease .6s both}
[data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 1px);left:20px;border:5px solid transparent;border-top-color:#1a1e28;z-index:1000;pointer-events:none;animation:tipIn .12s ease .6s both}
[data-tip].tr:hover::after{left:auto;right:0}
.galv-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:10px;}
.galv-table th{text-align:left; font-family:var(--f-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--steel); padding:6px 8px; border-bottom:2px solid var(--line);}
.galv-table td{padding:7px 8px; border-bottom:1px solid var(--line);}
.galv-badge{font-family:var(--f-mono); font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:9px;}
.galv-badge.galv-basso{background:rgba(79,195,247,.14); color:var(--patina-dark);}
.galv-badge.galv-moderato{background:rgba(255,167,38,.16); color:var(--brass);}
.galv-badge.galv-alto{background:rgba(239,83,80,.14); color:var(--rust);}
.galv-caveat{font-size:11.5px; color:var(--steel); line-height:1.5;}
.galv-note{font-size:11.5px; color:var(--steel); font-style:italic;}

/* ---------- Classificazione ---------- */
.class-intro{color:var(--steel); font-size:13px; line-height:1.5; margin:6px 0 14px;}
.class-toc{display:flex; flex-wrap:wrap; gap:8px;}
.class-toc-chip{
  font-family:var(--f-mono); font-size:12px; font-weight:600; padding:5px 12px; border-radius:14px;
  background:var(--panel-2); border:1px solid var(--fc,var(--line)); color:var(--ink); cursor:pointer;
}
.class-toc-chip:hover{background:var(--panel);}
.class-section{scroll-margin-top:20px;}
.class-section h3{font-size:19px; margin-bottom:10px;}
.class-sub{margin-bottom:14px;}
.class-sub b{display:block; font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); margin-bottom:6px;}
.class-sub p{font-size:13.5px; line-height:1.55; margin:0;}
.serie-text{font-family:var(--f-mono); font-size:12.5px; line-height:1.7; color:var(--ink);}
.decode-example{display:flex; align-items:baseline; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap;}
.decode-example:last-child{border-bottom:none;}
.decode-sigla{font-family:var(--f-mono); font-weight:700; font-size:13.5px; color:var(--ink); flex:0 0 auto;}
.decode-arrow{color:var(--steel-light);}
.decode-text{font-size:13px; color:var(--steel); line-height:1.4;}
.class-list{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px;}
.class-list li{font-size:13px; line-height:1.45;}

/* ---------- Detail sheet ---------- */
.sheet{background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); max-width:900px; margin:0 auto;}
.sheet-head{
  padding:20px 26px; border-bottom:3px solid var(--cat-color,var(--patina)); position:relative;
}
.back-btn{
  background:none;border:1px solid var(--line); border-radius:4px; padding:6px 10px; cursor:pointer; font-size:12px;
  font-family:var(--f-display); font-weight:600; color:var(--steel); margin-bottom:14px; display:inline-flex; gap:6px; align-items:center;
}
.back-btn:hover{background:var(--panel-2);}
.sheet-head .eyebrow{
  font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--cat-color,var(--patina)); font-weight:600;
}
.sheet-head h2{font-family:var(--f-mono); font-size:24px; margin:4px 0 2px; font-weight:600; letter-spacing:.01em;}
.sheet-head .sub{color:var(--steel); font-size:13.5px;}
.sheet-actions{position:absolute; right:26px; top:20px; display:flex; gap:8px;}
.icon-btn{
  background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:7px 10px; cursor:pointer;
  font-size:12px; font-family:var(--f-display); font-weight:600; display:flex; gap:6px; align-items:center; color:var(--ink);
}
.icon-btn:hover{border-color:var(--patina); color:var(--patina-dark);}
.icon-btn.active{background:var(--brass); border-color:var(--brass); color:#141519;}

.norm-table{display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin-top:14px; border:1px solid var(--line); border-radius:4px; overflow:hidden;}
.norm-table div{padding:8px 10px; border-right:1px solid var(--line); background:var(--panel-2);}
.norm-table div:last-child{border-right:none;}
.norm-table .lbl{font-family:var(--f-mono); font-size:9.5px; text-transform:uppercase; color:var(--steel); letter-spacing:.06em; display:block;}
.norm-table .val{font-family:var(--f-mono); font-size:13px; font-weight:600; margin-top:2px; display:block;}

.sheet-body{padding:6px 26px 28px;}
.section{padding:18px 0; border-bottom:1px solid var(--line);}
.section:last-child{border-bottom:none;}
.section h3{
  font-family:var(--f-display); font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--steel);
  margin:0 0 12px; display:flex; align-items:center; gap:8px;
}
.section h3::before{content:""; width:16px; height:2px; background:var(--cat-color,var(--patina)); display:inline-block;}

.prop-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px 16px;}
.prop{background:var(--panel-2); padding:8px 10px; border-radius:4px;}
.prop .lbl{font-size:10.5px; color:var(--steel); display:block; margin-bottom:2px;}
.prop .val{font-family:var(--f-mono); font-weight:600; font-size:14px;}
.prop .unit{font-size:10.5px; color:var(--steel); font-weight:400;}

.chem-text{background:var(--panel-2); padding:10px 12px; border-radius:4px; font-family:var(--f-mono); font-size:12.5px;}
.chim-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.chim-list li{display:flex; gap:10px; align-items:flex-start;}
.chim-list li .k{flex:0 0 130px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--steel); padding-top:1px;}
.chim-list li .v{flex:1; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
.chim-list li .v .weld-badge{flex:none;}

.treat-list{display:flex; flex-direction:column; gap:10px;}
.treat-item{border-left:3px solid var(--cat-color,var(--patina)); padding:4px 0 4px 12px;}
.treat-item .n{font-weight:600; font-family:var(--f-display); font-size:14px; display:flex; align-items:center; flex-wrap:wrap; gap:2px;}
.treat-item .e{color:var(--steel); font-size:12.5px; margin-top:2px;}
.norm-tag{
  display:inline-block; font-family:var(--f-mono); font-weight:600; font-size:9.5px; color:var(--steel);
  background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:1px 6px; margin-left:8px; white-space:nowrap;
}
.spring-badge{
  display:inline-flex; align-items:center; gap:4px; font-family:var(--f-mono); font-weight:700; font-size:10.5px;
  letter-spacing:.03em; color:var(--patina-dark); background:rgba(79,195,247,.12); border:1px solid rgba(79,195,247,.35);
  border-radius:10px; padding:2px 8px; vertical-align:middle;
}
.spring-info{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel-2); padding:10px 12px; border-radius:4px; font-size:12.5px; color:var(--steel);}
.spring-info b{color:var(--ink); font-family:var(--f-mono);}
.fatigue-note{margin-top:10px; padding:8px 12px; background:var(--panel-2); border-left:3px solid var(--brass); border-radius:4px; font-size:12.5px;}
.fatigue-note b{font-family:var(--f-mono); color:var(--ink);}
.fatigue-caveat{color:var(--steel); font-size:11px;}

.usi-list{display:flex; flex-wrap:wrap; gap:8px;}
.usi-list span{background:var(--panel-2); border:1px solid var(--line); padding:5px 10px; border-radius:12px; font-size:12px;}

.cost-bar{display:flex; gap:4px; margin-top:4px;}
.cost-bar div{width:16px; height:8px; border-radius:1px; background:var(--line);}
.cost-bar div.on{background:var(--brass);}

.note-box textarea{
  width:100%; min-height:70px; border:1px solid var(--line); border-radius:5px; padding:8px 10px;
  font-family:var(--f-body); font-size:13px; resize:vertical; background:var(--panel-2); color:var(--ink);
}
.note-box .save-hint{font-size:11px; color:var(--steel); margin-top:4px;}

/* ---------- Compare ---------- */
.compare-toolbar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.compare-slot{
  display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
  padding:6px 10px; border-radius:4px; font-size:12.5px;
}
.compare-slot .x{cursor:pointer; color:var(--rust); font-weight:700;}
.compare-picker{position:relative; flex:1; min-width:200px; max-width:340px;}
.compare-picker input{width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:5px; background:var(--panel-2); color:var(--ink); font-family:var(--f-mono);}
.compare-picker .suggestions{
  position:absolute; top:100%; left:0; right:0; background:var(--panel-2); border:1px solid var(--line); z-index:20;
  max-height:220px; overflow-y:auto; box-shadow:var(--shadow);
}
.compare-picker .suggestions div{padding:8px 10px; cursor:pointer; font-size:12.5px; border-bottom:1px solid var(--line);}
.compare-picker .suggestions div:hover{background:var(--panel);}

.compare-table-wrap{overflow-x:auto; background:var(--panel); border:1px solid var(--line);}
table.compare{border-collapse:collapse; width:100%; min-width:600px;}
table.compare th, table.compare td{border:1px solid var(--line); padding:9px 12px; text-align:left; font-size:12.5px; vertical-align:top;}
table.compare thead th{background:var(--panel-2); font-family:var(--f-mono); font-weight:600; position:sticky; top:53px;}
table.compare td.row-label, table.compare th.row-label{
  font-family:var(--f-mono); font-size:10.5px; text-transform:uppercase; color:var(--steel); background:var(--panel-2); white-space:nowrap;
}
table.compare th.mat-col{border-top:3px solid var(--col-color,var(--patina));}
table.compare .cell-detail{display:block; margin-top:4px; font-size:11px; color:var(--steel); font-family:var(--f-body);}

/* ---------- Wizard ---------- */
.wizard-box{max-width:720px; margin:0 auto; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); padding:24px 28px;}
.wizard-box h2{font-family:var(--f-display); margin-top:0;}
.wizard-step .q{font-family:var(--f-display); font-weight:600; font-size:15px; margin-bottom:10px;}
.wizard-options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
.wizard-options button{
  text-align:left; padding:12px 14px; border:1px solid var(--line); border-radius:5px; background:var(--panel); cursor:pointer; color:var(--ink);
}
.wizard-options button:hover{border-color:var(--patina);}
.wizard-options button.sel{border-color:var(--patina); background:rgba(79,195,247,.12);}
.wizard-options button .t{font-weight:600; font-size:13.5px; display:block;}
.wizard-options button .d{font-size:11.5px; color:var(--steel); display:block; margin-top:2px;}
.wizard-nav{display:flex; justify-content:space-between; margin-top:8px;}
.btn{
  background:var(--patina); color:#0e0f11; border:none; padding:9px 16px; border-radius:5px; cursor:pointer;
  font-family:var(--f-display); font-weight:600; font-size:13px;
}
.btn:hover{background:var(--patina-dark); color:#fff;}
.btn.ghost{background:none; border:1px solid var(--line); color:var(--ink);}
.btn.ghost:hover{border-color:var(--steel);}
.wizard-result-item{border:1px solid var(--line); border-left:4px solid var(--cat-color,var(--patina)); padding:12px 14px; margin-bottom:10px; cursor:pointer; background:var(--panel);}
.wizard-result-item:hover{background:var(--panel-2);}
.wizard-result-item h4{margin:0 0 3px; font-family:var(--f-mono); font-size:14px; font-weight:600;}
.wizard-result-item .why{font-size:12px; color:var(--patina-dark); font-family:var(--f-mono);}

/* ---------- Custom material form ---------- */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.form-grid label{font-size:12px; font-weight:600; display:block; margin-bottom:4px;}
.form-grid input, .form-grid textarea, .form-grid select{
  width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:5px; font-family:var(--f-body); font-size:13px; background:var(--panel-2); color:var(--ink);
}
.form-grid .full{grid-column:1/-1;}
.form-grid textarea{min-height:56px;}

/* ---------- misc ---------- */
.footer-note{max-width:900px;margin:30px auto 0;padding:14px 20px;color:var(--steel);font-size:11.5px;border-top:1px solid var(--line);}
.io-buttons{display:flex; gap:8px;}
.tag-line{display:flex; flex-wrap:wrap; gap:6px; font-size:11px; color:var(--steel); margin-top:10px;}
.badge-count{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:2px 8px; font-family:var(--f-mono);}

@media print{
  body::before{display:none;}
  .topbar, .sidebar, .sheet-actions, .back-btn, .results-bar, .compare-toolbar, .footer-note, .note-box{display:none !important;}
  body{background:#fff;}
  .sheet{box-shadow:none; border:none; max-width:100%;}
  main{padding:0;}
  .layout{display:block;}
}

@media (max-width:860px){
  .sidebar{position:static; width:100%; flex:1 1 100%; max-height:none; border-right:none; border-bottom:1px solid var(--line);}
  .layout{flex-direction:column;}
  .prop-grid{grid-template-columns:repeat(2,1fr);}
  .wizard-options{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>

/* ---------------- Helpers ---------------- */
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, function(s){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[s];
  });
}
function fmt(val){
  if(val===undefined||val===null||val==='') return '—';
  return escapeHtml(val);
}
function firstNumber(str){
  if(str===undefined||str===null) return null;
  var m = String(str).match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function corrScore(text){
  if(!text) return 2;
  var t = String(text).toLowerCase();
  if(t.indexOf('eccezionale')>=0 || t.indexOf('eccellentissima')>=0 || t.indexOf('eccellente')>=0) return 5;
  if(t.indexOf('molto buona')>=0 || t.indexOf('ottima')>=0) return 4;
  if(t.indexOf('buona')>=0) return 3;
  if(t.indexOf('discreta')>=0 || t.indexOf('moderata')>=0) return 2;
  if(t.indexOf('bassa')>=0 || t.indexOf('scarsa')>=0) return 1;
  return 2;
}
function lavScore(text){
  if(!text) return 2;
  var t = String(text).toLowerCase();
  if(t.indexOf('eccellente')>=0 || t.indexOf('ottima')>=0) return 5;
  if(t.indexOf('buona')>=0) return 4;
  if(t.indexOf('discreta')>=0) return 3;
  if(t.indexOf('molto difficile')>=0) return 0;
  if(t.indexOf('difficile')>=0) return 1;
  return 2;
}
function saldScore(text){
  if(!text) return 2;
  var t = String(text).toLowerCase();
  if(t.indexOf('non saldabile')>=0 || t.indexOf('sconsigliat')>=0 || t.indexOf('scarsa')>=0) return 1;
  if(t.indexOf('eccellente')>=0 || t.indexOf('ottima')>=0) return 5;
  if(t.indexOf('buona')>=0) return 4;
  if(t.indexOf('discreta')>=0 || t.indexOf('possibile')>=0) return 3;
  if(t.indexOf('difficile')>=0 || t.indexOf('limitata')>=0) return 2;
  if(t.indexOf('saldabile')>=0) return 4;
  return 2;
}
function saldBadgeInfo(text){
  var s = saldScore(text);
  var cls = s>=4 ? 'weld-good' : (s===3 ? 'weld-mid' : 'weld-poor');
  var lbl = s>=5 ? 'Ottima' : s===4 ? 'Buona' : s===3 ? 'Discreta' : s===2 ? 'Limitata' : 'Scarsa';
  return {cls:cls, lbl:lbl, score:s};
}
function saldBadge(text){
  var info = saldBadgeInfo(text);
  var title = text ? escapeHtml(String(text)) : 'Non specificata';
  return '<span class="weld-badge '+info.cls+'" title="Saldabilità: '+title+'">'+info.lbl+'</span>';
}
/* ---- Riferimenti normativi indicativi (trattamenti termici, superficiali, saldatura) ----
   Nota: riferimenti generali e indicativi per famiglia/processo, utili come punto di partenza;
   la norma esatta applicabile va sempre verificata con il capitolato tecnico specifico. */
function heatTreatmentNorma(cat, ttName){
  var n = String(ttName||'').toLowerCase();
  if(/^(non |nessun|generalmente non)/.test(n)) return null;
  if(n.indexOf('molla')>=0 || n.indexOf('molle')>=0){
    if(cat==='Acciai Inox') return 'EN 10151 (nastri inox per molle) · EN 10270-3 (fili inox per molle)';
    return 'EN 10089 (acciai per molle) · EN 10270 (fili per molle)';
  }
  switch(cat){
    case 'Acciai':
      if(n.indexOf('cementaz')>=0) return 'EN 10084 (acciai da cementazione)';
      if(n.indexOf('nitrurazi')>=0) return 'EN 10085 (acciai da nitrurazione)';
      return 'EN 10083 (acciai da bonifica) · ISO 683';
    case 'Acciai Inox':
      return 'EN 10088 (acciai inossidabili)';
    case 'Alluminio':
      return 'EN 515 (designazione stati di trattamento Al)';
    case 'Ghise':
      if(n.indexOf('austemper')>=0) return 'EN 1564 / ISO 17804 (ghisa austemperata ADI)';
      if(n.indexOf('malleabilizza')>=0) return 'EN 1562 (ghise malleabili)';
      return 'EN 1563 (ghise sferoidali) / EN 1561 (ghise grigie)';
    case 'Rame':
      return 'EN 1173 (designazione stati di trattamento Cu)';
    case 'Titanio':
      return 'ASTM B348 / AMS 2801 (trattamenti termici leghe Ti)';
    default:
      return null; // materie plastiche: indicazioni da scheda tecnica del produttore, no norma dedicata
  }
}
function surfaceTreatmentNorma(tsName){
  var n = String(tsName||'').toLowerCase();
  if(/^nessun trattamento/.test(n)) return null;
  if(n.indexOf('zincatura elettrolitica')>=0) return 'ISO 2081 (zincatura elettrolitica)';
  if(n.indexOf('lamellare')>=0 || n.indexOf('dacromet')>=0 || n.indexOf('geomet')>=0) return 'ISO 10683 (rivestimenti a scaglie di zinco per elementi di fissaggio)';
  if(n.indexOf('zincatura')>=0) return 'EN ISO 1461 (zincatura a caldo)';
  if(n.indexOf('nitrurazione')>=0) return 'EN 10085 (nitrurazione)';
  if(n.indexOf('fosfataz')>=0) return 'ISO 9717 (fosfatazione)';
  if(n.indexOf('anodizza')>=0) return 'EN ISO 7599 (anodizzazione Al)';
  if(n.indexOf('cromatura')>=0 && n.indexOf('plastica')<0) return 'ISO 6158 (cromatura dura)';
  if(n.indexOf('cromatazione')>=0) return 'ISO 4520 (cromatazione)';
  if(n.indexOf('nichelatura')>=0) return 'ISO 4527 (nichelatura chimica Ni-P)';
  if(n.indexOf('pallinatura')>=0) return 'SAE J442 / AMS 2430 (pallinatura)';
  if(n.indexOf('passivazione')>=0) return 'ASTM A967 (passivazione acciai inox)';
  if(n.indexOf('decapaggio')>=0) return 'ASTM A380 (pulizia, decapaggio e passivazione acciai inox)';
  if(n.indexOf('verniciatura')>=0 || n.indexOf('laccatura')>=0) return 'ISO 12944 (protezione anticorrosiva a vernice)';
  return null;
}
function weldingNorms(cat){
  switch(cat){
    case 'Acciai': return 'EN 1011-2 · ISO 15614-1';
    case 'Acciai Inox': return 'EN 1011-3 · ISO 15614-1';
    case 'Alluminio': return 'EN 1011-4 · ISO 15614-2';
    case 'Ghise': return 'EN 1011-8 · ISO 15614-3';
    case 'Rame': return 'ISO 15614-6';
    case 'Titanio': return 'ISO 15614-5 · ISO 5817';
    case 'Materie Plastiche': return 'DVS 2207 · EN 13067';
    default: return null;
  }
}
function normTag(text){
  return text ? '<span class="norm-tag" title="Riferimento normativo indicativo">'+escapeHtml(text)+'</span>' : '';
}

var TREATMENT_LOOKUP_ORDER = ['tempra-bainitica','criogenico','cementazione','nitrurazione','tempra-superficiale',
  'tempra-rinvenimento','malleabilizzazione','normalizzazione','invecchiamento','solubilizzazione','incrudimento','ricottura',

  'rivestimento-pvd','elettrolucidatura','brunitura','metallizzazione','stagnatura','argentatura','alclad','trattamenti-plastiche'];
var TREATMENT_BY_ID = {};
TREATMENTS.forEach(function(t){ TREATMENT_BY_ID[t.id] = t; });
function findTreatmentFor(name){

/* ---- Idoneità alla realizzazione di molle ---- */
function isSpringMaterial(m){
  var usi = (m.usi||[]).join(' ').toLowerCase();
  var sub = String(m.sub||'').toLowerCase();
  return usi.indexOf('molla')>=0 || usi.indexOf('molle')>=0 || sub.indexOf('molle')>=0;
}
function springIndex(m){
  var rp = firstNumber(m.mec.rp);
  var e = typeof m.fis.mod === 'number' ? m.fis.mod : firstNumber(m.fis.mod);
  if(!rp || !e) return 0;
  return rp/e; // indice elastico Rp0.2/E: più alto = maggiore capacità di accumulo elastico a parità di rigidezza
}
/* ---- Stima indicativa della resistenza a fatica (regola pratica, non dato misurato) ---- */
var FATIGUE_RATIO = {'Acciai':0.5, 'Acciai Inox':0.45, 'Ghise':0.38, 'Alluminio':0.33, 'Titanio':0.5, 'Rame':0.3};
function fatigueEstimate(m){
  var ratio = FATIGUE_RATIO[m.cat];
  if(!ratio) return null; // non stimato per Materie Plastiche: comportamento a fatica di natura viscoelastica, non riconducibile a un semplice rapporto con Rm
  var rm = firstNumber(m.mec.rm);
  if(!rm) return null;
  var plateau = (m.cat==='Acciai' || m.cat==='Acciai Inox') ? 700 : null;
  var val = ratio * rm;
  if(plateau && val > plateau) val = plateau;
  return {value: Math.round(val), ratio: ratio};
}
function springBadge(){
  return '<span class="spring-badge" title="Materiale tipicamente impiegato per la realizzazione di molle">⚙ Molle</span>';
}
/* ---- Calcolatore peso stimato da geometria semplice ---- */
function weightCalcHtml(m){
  return '<div class="section calc-section"><h3>Calcolatore peso stimato</h3>'+
    '<div class="calc-row"><label data-tip="Forma geometrica semplificata usata per stimare il volume del pezzo.\nIl volume calcolato viene poi moltiplicato per la densità del materiale (peso = volume × densità).\nScegli quella più vicina alla geometria reale (grezza, senza lavorazioni).">Geometria</label>'+
      '<select id="calc-geom">'+
        '<option value="barra">Barra tonda (Ø × L)</option>'+
        '<option value="piastra">Piastra (L × largh. × spess.)</option>'+
        '<option value="tubo">Tubo (Ø est. × spess. parete × L)</option>'+
      '</select>'+
    '</div>'+
    '<div id="calc-dims-barra" class="calc-dims">'+
      '<label data-tip="Diametro della barra tonda a sezione piena\nUnità: mm\nVolume = π × (Ø/2)² × L">Diametro (mm) <input type="number" id="calc-d" value="20" min="0" step="0.1"></label>'+
      '<label data-tip="Lunghezza della barra\nUnità: mm\nVolume = π × (Ø/2)² × L">Lunghezza (mm) <input type="number" id="calc-l" value="1000" min="0" step="1"></label>'+
    '</div>'+
    '<div id="calc-dims-piastra" class="calc-dims" style="display:none">'+
      '<label data-tip="Lunghezza della piastra rettangolare\nUnità: mm\nVolume = L × largh. × spess.">Lunghezza (mm) <input type="number" id="calc-a" value="1000" min="0" step="1"></label>'+
      '<label data-tip="Larghezza della piastra rettangolare\nUnità: mm\nVolume = L × largh. × spess.">Larghezza (mm) <input type="number" id="calc-b" value="500" min="0" step="1"></label>'+
      '<label data-tip="Spessore della piastra\nUnità: mm\nVolume = L × largh. × spess.">Spessore (mm) <input type="number" id="calc-s" value="5" min="0" step="0.1"></label>'+
    '</div>'+
    '<div id="calc-dims-tubo" class="calc-dims" style="display:none">'+
      '<label data-tip="Diametro esterno del tubo\nUnità: mm\nVolume = π × [(Øest/2)² − (Øint/2)²] × L, con Øint = Øest − 2×spessore parete">Ø esterno (mm) <input type="number" id="calc-de" value="30" min="0" step="0.1"></label>'+
      '<label data-tip="Spessore della parete del tubo\nUnità: mm\nDiametro interno stimato = Ø esterno − 2 × spessore parete">Spessore parete (mm) <input type="number" id="calc-sp" value="3" min="0" step="0.1"></label>'+
      '<label class="tr" data-tip="Lunghezza del tubo\nUnità: mm\nVolume = π × [(Øest/2)² − (Øint/2)²] × L">Lunghezza (mm) <input type="number" id="calc-tl" value="1000" min="0" step="1"></label>'+
    '</div>'+
    '<div class="calc-result">Peso stimato: <b id="calc-weight-val">—</b> kg'+
      '<div class="calc-note">Basato sulla densità di '+m.fis.dens+' kg/m³; geometria idealizzata, non considera sovrametalli di lavorazione né tolleranze.</div>'+
    '</div>'+
  '</div>';
}
function computeWeightKg(geom, dims, densityKgM3){
  var volumeMm3 = 0;
  if(geom==='barra'){
    var r = dims.d/2;
    volumeMm3 = Math.PI * r * r * dims.l;
  } else if(geom==='piastra'){
    volumeMm3 = dims.a * dims.b * dims.s;
  } else if(geom==='tubo'){
    var rOut = dims.de/2, rIn = Math.max(0, (dims.de - 2*dims.sp)/2);
    volumeMm3 = Math.PI * (rOut*rOut - rIn*rIn) * dims.l;
  }
  return volumeMm3 * densityKgM3 / 1e9; // mm^3 -> m^3 (÷1e9) poi × kg/m^3
}
function initWeightCalc(main, densityKgM3){
  var geomSel = main.querySelector('#calc-geom');
  if(!geomSel) return;
  var panels = {barra: main.querySelector('#calc-dims-barra'), piastra: main.querySelector('#calc-dims-piastra'), tubo: main.querySelector('#calc-dims-tubo')};
  var resultEl = main.querySelector('#calc-weight-val');
  function num(id){ var el = main.querySelector('#'+id); var v = el ? parseFloat(el.value) : NaN; return isNaN(v) ? 0 : v; }
  function recompute(){
    var geom = geomSel.value;
    var dims;
    if(geom==='barra') dims = {d:num('calc-d'), l:num('calc-l')};
    else if(geom==='piastra') dims = {a:num('calc-a'), b:num('calc-b'), s:num('calc-s')};
    else dims = {de:num('calc-de'), sp:num('calc-sp'), l:num('calc-tl')};
    var w = computeWeightKg(geom, dims, densityKgM3);
    resultEl.textContent = w >= 100 ? w.toFixed(1) : (w >= 1 ? w.toFixed(2) : w.toFixed(4));
  }
  geomSel.addEventListener('change', function(){
    Object.keys(panels).forEach(function(k){ panels[k].style.display = (k===geomSel.value) ? 'flex' : 'none'; });
    recompute();
  });
  main.querySelectorAll('.calc-dims input').forEach(function(inp){ inp.addEventListener('input', recompute); });
  recompute();
}

  ].filter(Boolean).join(' ').toLowerCase();

function applySort(list){

  else if(state.sort==='rmDesc') arr.sort(function(a,b){ return (firstNumber(b.mec.rm)||0)-(firstNumber(a.mec.rm)||0); });

function attachCardHandlers(main){
  main.querySelectorAll('.mat-card').forEach(function(card){

    ['Allungamento (%)', function(m){return m.mec.all;}],
    ['Durezza', function(m){return m.mec.dur;}],
    ['Resist. corrosione', function(m){return m.chim.corr;}],
    ['Saldabilità', function(m){return m.chim.sald;}],
    ['Lavorabilità', function(m){return m.chim.lav;}],
    ['Costo relativo', function(m){return '★'.repeat(m.costo||0)+'☆'.repeat(5-(m.costo||0));}],
    ['Campi di utilizzo', function(m){return (m.usi||[]).join(', ');}]
  ];
  var html = '<div class="compare-table-wrap"><table class="compare"><thead><tr><th class="row-label">Proprietà</th>' +
    mats.map(function(m){ return '<th class="mat-col" style="--col-color:'+getCatColor(m.cat)+'">'+escapeHtml(m.nome)+'</th>'; }).join('') +
    '</tr></thead><tbody>';
  rows.forEach(function(r){

      var v = r[1](m);

    }).join('') + '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

/* ---- Compatibilità galvanica (indicativa, per famiglia) ---- */
var GALVANIC_POTENTIAL = {
  'Alluminio': -0.85,
  'Ghise': -0.61,
  'Acciai': -0.61,
  'Acciai Inox': -0.08,
  'Rame': -0.33,
  'Titanio': -0.05
  // 'Materie Plastiche' esclusa di proposito: non conduttrice, non forma coppia galvanica
};
function galvanicRisk(catA, catB){
  var pa = GALVANIC_POTENTIAL[catA], pb = GALVANIC_POTENTIAL[catB];
  if(pa===undefined || pb===undefined) return null;
  var diff = Math.abs(pa-pb);
  var anodicCat = pa < pb ? catA : catB;
  var level, label;
  if(diff < 0.15){ level='basso'; label='Rischio basso'; }
  else if(diff < 0.30){ level='moderato'; label='Rischio moderato'; }
  else { level='alto'; label='Rischio elevato'; }
  return {diff: diff, anodicCat: anodicCat, level: level, label: label};
}
function buildGalvanicSection(mats){
  var cats = [];
  mats.forEach(function(m){ if(cats.indexOf(m.cat)<0) cats.push(m.cat); });
  var applicableCats = cats.filter(function(c){ return GALVANIC_POTENTIAL[c]!==undefined; });
  if(applicableCats.length < 2) return '';
  var rows = '';
  for(var i=0;i<applicableCats.length;i++){
    for(var j=i+1;j<applicableCats.length;j++){
      var r = galvanicRisk(applicableCats[i], applicableCats[j]);
      if(!r) continue;
      rows += '<tr><td>'+applicableCats[i]+'</td><td>'+applicableCats[j]+'</td>'+
        '<td>'+r.diff.toFixed(2)+' V</td><td>'+escapeHtml(r.anodicCat)+'</td><td><span class="galv-badge galv-'+r.level+'">'+r.label+'</span></td></tr>';
    }
  }
  var excludedNote = cats.length > applicableCats.length ? '<p class="galv-note">Le materie plastiche presenti nel confronto sono escluse dall\'analisi: non essendo conduttrici, non partecipano alla coppia galvanica.</p>' : '';
  return '<div class="section galvanic-section"><h3>Compatibilità galvanica tra le famiglie confrontate</h3>'+
    '<table class="galv-table"><thead><tr><th>Metallo A</th><th>Metallo B</th><th>ΔPotenziale</th><th>Si corrode (anodo)</th><th>Rischio</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<p class="galv-caveat">Potenziali indicativi di famiglia in acqua di mare (V vs SCE), non del singolo grado/lega specifico. Gli acciai inox sono considerati nel tipico stato passivo (ben areato): in condizioni di anaerobiosi/interstizio il comportamento si avvicina a quello attivo, molto più anodico. Sopra i 0.30 V di differenza, valutare isolamento elettrico tra i metalli o protezione catodica; per applicazioni critiche verificare i dati specifici di lega e ambiente.</p>'+
    excludedNote+
  '</div>';
}
function renderCompare(main){
  var mats = compareIds.map(findMaterial).filter(Boolean);
  main.innerHTML =
    '<div class="compare-toolbar">'+
      mats.map(function(m){ return '<div class="compare-slot">'+escapeHtml(m.nome)+' <span class="x" data-remove="'+m.id+'">✕</span></div>'; }).join('')+
      '<div class="compare-picker"><input type="text" id="compare-search" placeholder="Aggiungi materiale al confronto (max 4)..."><div class="suggestions" id="compare-suggestions" style="display:none;"></div></div>'+
      (mats.length ? '<button class="icon-btn" id="print-compare">🖶 Stampa confronto</button>' : '')+
    '</div>'+
    (mats.length<2
      ? '<div class="empty-state"><h3>Aggiungi almeno 2 materiali</h3><p>Usa il campo di ricerca qui sopra per selezionare i materiali da confrontare fianco a fianco.</p></div>'
      : buildCompareTable(mats) + buildGalvanicSection(mats));

  main.querySelectorAll('[data-remove]').forEach(function(btn){
    btn.addEventListener('click', function(){ toggleCompare(btn.dataset.remove); renderApp(); });
  });
  var searchInput = document.getElementById('compare-search');
  var sugBox = document.getElementById('compare-suggestions');
  if(searchInput){
    searchInput.addEventListener('input', function(){
      var q = searchInput.value.trim().toLowerCase();

      var results = allMaterials().filter(function(m){
        return compareIds.indexOf(m.id)<0 && m.nome.toLowerCase().indexOf(q)>=0;
      }).slice(0,8);
      sugBox.innerHTML = results.map(function(m){
        return '<div data-add="'+m.id+'">'+escapeHtml(m.nome)+' <span style="color:#999;font-size:11px;">('+escapeHtml(m.cat)+')</span></div>';
      }).join('') || '<div style="color:#999;padding:8px 10px;">Nessun risultato</div>';
      sugBox.style.display='block';
      sugBox.querySelectorAll('[data-add]').forEach(function(el){
        el.addEventListener('click', function(){
          if(compareIds.length>=4){ alert('Massimo 4 materiali.'); return; }
          compareIds.push(el.dataset.add); searchInput.value=''; sugBox.style.display='none'; renderApp();
        });
      });
    });
    document.addEventListener('click', function(e){
      if(sugBox && !e.target.closest('.compare-picker')) sugBox.style.display='none';
    });
  }
  var pcBtn = document.getElementById('print-compare');
  if(pcBtn) pcBtn.addEventListener('click', function(){ window.print(); });

/* ---------------- Wizard ---------------- */
function scoreMaterial(m, requisito){
  switch(requisito){
    case 'meccanica': { var n1=firstNumber(m.mec.rm); return n1===null?0:n1; }
    case 'corrosione': return corrScore(m.chim.corr)*100;
    case 'leggerezza': return m.fis.dens ? (1/m.fis.dens)*1000000 : 0;
    case 'altaTemperatura': { var n2 = m.fis.tmax!==undefined ? firstNumber(m.fis.tmax) : firstNumber(m.fis.fus); return n2===null?0:n2; }
    case 'lavorabilita': return lavScore(m.chim.lav)*100;
    case 'saldabilita': return saldScore(m.chim.sald)*100;
    case 'costoBasso': return (6-(m.costo||3))*100;
    case 'molle': return (isSpringMaterial(m)?10000:0) + springIndex(m)*1000;
    case 'fatica': { var fe=fatigueEstimate(m); return fe ? fe.value : 0; }
    default: return 0;
  }
}
function wizardWhy(m, requisito){
  switch(requisito){
    case 'meccanica': return 'Rm indicativo: '+m.mec.rm+' MPa';
    case 'corrosione': return 'Resistenza a corrosione: '+m.chim.corr;
    case 'leggerezza': return 'Densità: '+m.fis.dens+' kg/m³';
    case 'altaTemperatura': return m.fis.tmax!==undefined ? 'Temperatura massima di esercizio continuo: '+m.fis.tmax+' °C' : 'Punto di fusione: '+m.fis.fus+' °C';
    case 'lavorabilita': return 'Lavorabilità: '+m.chim.lav;
    case 'saldabilita': { var wn=weldingNorms(m.cat); return 'Saldabilità: '+m.chim.sald+(wn?' — Norme di riferimento: '+wn:''); }
    case 'costoBasso': return 'Costo relativo: '+'★'.repeat(m.costo||0)+'☆'.repeat(5-(m.costo||0));
    case 'molle': { var idx=springIndex(m); return (isSpringMaterial(m)?'Materiale tipicamente impiegato per molle. ':'Non tipico per molle, ma indicativamente valutabile. ')+'Indice elastico Rp0.2/E: '+(idx?(idx*1000).toFixed(1)+' ‰':'—'); }
    case 'fatica': { var fe2=fatigueEstimate(m); return fe2 ? 'Resistenza a fatica stimata: ~'+fe2.value+' MPa (regola pratica ≈'+fe2.ratio+'×Rm, non un dato misurato)' : 'Non stimabile per questa famiglia di materiali'; }
    default: return '';
  }
}
function buildWizardResults(){
  var requisito = wizardState.answers.requisito;
  var categoria = wizardState.answers.categoria || 'Tutte';
  var pool = allMaterials().filter(function(m){ return categoria==='Tutte' || m.cat===categoria; });
  pool = pool.map(function(m){ return {m:m, score:scoreMaterial(m, requisito)}; });
  pool.sort(function(a,b){ return b.score-a.score; });
  var top = pool.slice(0,8);
  var reqOpt = WIZARD_QUESTIONS[0].options.filter(function(o){ return o.v===requisito; })[0] || {};
  var reqLabel = reqOpt.t || '';
  return '<div class="wizard-box"><h2>Materiali consigliati</h2>'+
    '<p style="color:var(--steel);font-size:13px;">In base al requisito <b>'+escapeHtml(reqLabel)+'</b>'+(categoria!=='Tutte'?' nella famiglia <b>'+escapeHtml(categoria)+'</b>':'')+', ecco gli 8 materiali più indicati nell\'archivio:</p>'+
    top.map(function(item,i){
      var m = item.m;
      return '<div class="wizard-result-item" data-id="'+m.id+'" style="--cat-color:'+getCatColor(m.cat)+'" tabindex="0" role="button">'+
        '<h4>'+(i+1)+'. '+escapeHtml(m.nome)+' <span style="font-weight:400;color:var(--steel);font-size:12px;">— '+escapeHtml(m.cat)+'</span></h4>'+
        '<div class="why">'+escapeHtml(wizardWhy(m, requisito))+'</div>'+
      '</div>';
    }).join('') +
    '<div class="wizard-nav" style="margin-top:16px;"><button class="btn ghost" id="wizard-restart">↺ Ricomincia</button></div>'+
  '</div>';
}
function renderWizard(main){
  if(wizardState.step >= WIZARD_QUESTIONS.length){
    main.innerHTML = buildWizardResults();
    document.getElementById('wizard-restart').addEventListener('click', function(){ wizardState={step:0,answers:{}}; renderApp(); });
    main.querySelectorAll('.wizard-result-item').forEach(function(el){
      var go = function(){ state.view='detail'; state.detailId=el.dataset.id; renderApp(); };
      el.addEventListener('click', go);
      el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
    });
    return;
  }
  var q = WIZARD_QUESTIONS[wizardState.step];
  var selected = wizardState.answers[q.key];
  main.innerHTML =
    '<div class="wizard-box"><h2>Wizard: trova il materiale adatto</h2>'+
      '<div class="wizard-step"><div class="q">'+(wizardState.step+1)+'. '+escapeHtml(q.q)+'</div>'+
      '<div class="wizard-options">'+
        q.options.map(function(o){ return '<button data-v="'+o.v+'" class="'+(selected===o.v?'sel':'')+'"><span class="t">'+escapeHtml(o.t)+'</span><span class="d">'+escapeHtml(o.d)+'</span></button>'; }).join('')+
      '</div></div>'+
      '<div class="wizard-nav">'+
        '<button class="btn ghost" id="wiz-back" '+(wizardState.step===0?'disabled':'')+'>&larr; Indietro</button>'+
        '<button class="btn" id="wiz-next" '+(selected?'':'disabled')+'>'+(wizardState.step===WIZARD_QUESTIONS.length-1?'Vedi risultati':'Avanti')+' &rarr;</button>'+
      '</div>'+
    '</div>';
  main.querySelectorAll('.wizard-options button').forEach(function(btn){
    btn.addEventListener('click', function(){ wizardState.answers[q.key]=btn.dataset.v; renderApp(); });
  });
  document.getElementById('wiz-back').addEventListener('click', function(){ wizardState.step=Math.max(0,wizardState.step-1); renderApp(); });
  document.getElementById('wiz-next').addEventListener('click', function(){ if(wizardState.answers[q.key]){ wizardState.step++; renderApp(); } });
}

function renderIO(main){
  var favCount = Object.keys(favorites).filter(function(id){return favorites[id].fav;}).length;
  var noteCount = Object.keys(favorites).filter(function(id){return favorites[id].note && favorites[id].note.trim();}).length;
  main.innerHTML =
    '<div class="wizard-box"><h2>Gestione dati personali</h2>'+
    '<p style="color:var(--steel);font-size:13px;">Questa app non usa lo spazio di archiviazione del browser: preferiti, note e materiali personalizzati esistono solo per questa sessione. '+
    'Usa <b>Esporta</b> per salvare un file di backup, e <b>Importa</b> per ricaricarlo in una sessione futura (anche su un altro computer).</p>'+
    '<div class="io-buttons">'+
      '<button class="btn" id="export-btn">⬇ Esporta dati (.json)</button>'+
      '<button class="btn ghost" id="import-btn">⬆ Importa dati (.json)</button>'+
      '<input type="file" id="import-file" accept="application/json" style="display:none;">'+
    '</div>'+
    '<div class="tag-line">'+
      '<span class="badge-count">'+favCount+' preferiti</span>'+
      '<span class="badge-count">'+noteCount+' note</span>'+
      '<span class="badge-count">'+customMaterials.length+' materiali personalizzati</span>'+
    '</div></div>';
  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('import-btn').addEventListener('click', function(){ document.getElementById('import-file').click(); });
  document.getElementById('import-file').addEventListener('change', importData);
}
function exportData(){
  var payload = { favorites:favorites, customMaterials:customMaterials, exportedAt:new Date().toISOString(), version:1 };
  var blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'materiali-dati-personali.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var payload = JSON.parse(reader.result);
      if(payload.favorites) favorites = payload.favorites;
      if(payload.customMaterials) customMaterials = payload.customMaterials;
      alert('Dati importati correttamente.');
      renderApp();
    }catch(err){
      alert('File non valido: impossibile leggere i dati.');
    }
  };
  reader.readAsText(file);
}

function getFilteredTreatments(){
  return TREATMENTS.filter(function(t){
    if(state.treatmentTipo!=='Tutti' && t.tipo!==state.treatmentTipo) return false;
    if(state.treatmentFamiglia!=='Tutte' && t.famiglie.indexOf(state.treatmentFamiglia)<0) return false;
    return true;
  }).sort(function(a,b){ return a.nome.localeCompare(b.nome); });
}
function materialsUsingTreatment(t){
  var out = [];
  allMaterials().forEach(function(m){
    var all = (m.tt||[]).concat(m.ts||[]);
    for(var i=0;i<all.length;i++){
      var match = findTreatmentFor(all[i].n);
      if(match && match.id===t.id){ out.push(m); return; }
    }
  });
  return out;
}

function renderClassification(main){
  var tocHtml = CLASSIFICATION_DATA.map(function(c){
    return '<button class="class-toc-chip" data-target="'+c.id+'" style="--fc:'+c.color+'">'+escapeHtml(c.cat)+'</button>';
  }).join('');
  var sectionsHtml = CLASSIFICATION_DATA.map(function(c){
    var esempiHtml = (c.esempi||[]).map(function(e){
      return '<div class="decode-example"><span class="decode-sigla">'+escapeHtml(e.sigla)+'</span><span class="decode-arrow">→</span><span class="decode-text">'+e.decodifica+'</span></div>';
    }).join('');
    return '<div class="section class-section" id="'+c.id+'" style="border-left:4px solid '+c.color+';">'+
      '<h3 style="color:'+c.color+';">'+escapeHtml(c.cat)+'</h3>'+
      '<div class="class-sub"><b>Sistema di designazione</b><p>'+c.sistema+'</p></div>'+
      (esempiHtml ? '<div class="class-sub"><b>Esempi decodificati</b>'+esempiHtml+'</div>' : '')+
      (c.serie ? '<div class="class-sub"><b>Serie principali</b><p class="serie-text">'+c.serie+'</p></div>' : '')+
      (c.lettereGruppo1 ? '<div class="class-sub"><b>Lettere iniziali più comuni (Gruppo 1)</b><p class="serie-text">'+c.lettereGruppo1+'</p></div>' : '')+
      '<div class="class-sub"><b>Sottocategorie principali</b><ul class="class-list">'+c.sottocategorie.map(function(s){ return '<li>'+s+'</li>'; }).join('')+'</ul></div>'+
    '</div>';
  }).join('');
  main.innerHTML =
    '<div class="sheet">'+
      '<div class="sheet-head" style="border-color:var(--brass);">'+
        '<h2>Guida alla classificazione dei materiali</h2>'+
        '<p class="class-intro">Come leggere le sigle e i numeri di designazione di ciascuna famiglia, e come si suddividono al loro interno. Riferimenti generali e indicativi: per il capitolato tecnico esatto fare sempre riferimento al testo integrale della norma.</p>'+
        '<div class="class-toc">'+tocHtml+'</div>'+
      '</div>'+
      '<div class="sheet-body">'+sectionsHtml+'</div>'+
    '</div>';
  main.querySelectorAll('.class-toc-chip').forEach(function(btn){
    btn.addEventListener('click', function(){
      var el = document.getElementById(btn.dataset.target);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

/* ---------------- Init ---------------- */
function init(){
  document.getElementById('global-search').addEventListener('input', function(e){
    state.search = e.target.value;
    if(state.view!=='list' && state.view!=='favorites') state.view='list';
    renderApp();
  });
  document.querySelectorAll('#main-nav button').forEach(function(btn){
    btn.addEventListener('click', function(){ state.view = btn.dataset.view; renderApp(); });
  });
  renderApp();
}
init();

})();

</script>
